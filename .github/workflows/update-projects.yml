name: Update projects data

# Regenerates assets/data/projects.json from the GitHub API, including private
# repos tagged with the opt-in topic. Commits the result back to main, which is
# what GitHub Pages serves.

on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch repos
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: node scripts/fetch-projects.mjs

      - name: Commit if changed
        run: |
          # Stage first: the file is untracked on the very first run, and
          # `git diff` alone ignores untracked files.
          git add assets/data/projects.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update projects data"
          git push
